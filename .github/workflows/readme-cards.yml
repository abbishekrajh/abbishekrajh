name: Refresh README cards

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", ".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Fetch GitHub stats
        env:
          # Add a GH_PAT secret (read:user scope) to also count private contributions.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py
      - name: Render cards
        run: python scripts/render_readme_cards.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
